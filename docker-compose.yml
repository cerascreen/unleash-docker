# This docker compose setup configures
#  - the Unleash server instance +
#  - the necessary backing Postgres database.
#
# To learn more about all the parts of Unleash, visit
# https://docs.getunleash.io
#
# NOTE: please do not use this configuration unchanged for production setups.
# Unleash does not take responsibility for any data leaks or other
# problems that may arise as a result.
#
# This is intended to be used for demo, development, and learning purposes only.

services:
  web:
    image: ${UNLEASH_IMAGE:-unleashorg/unleash-server:latest}
    build: .
    ports:
      - "4242:4242"
    environment:
      # This points Unleash to its backing database (defined in the `db` section below)
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:unleash@db/udb}"
      # Disable SSL for database connections. COMMENT THIS ON PRODUCTION!
      DATABASE_SSL: "${DATABASE_SSL:-false}"
      # Initialize Unleash with a default set of client API tokens.
      # To initialize Unleash with multiple tokens, separate them with a comma (`token1,token2`).
      # These tokens can be used by the Proxy or by *server-side* client SDKs.
      INIT_CLIENT_API_TOKENS: "default:development.unleash-insecure-api-token"
      # Changing log levels:
      # LOG_LEVEL: "debug"
    depends_on:
      - db
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1
      interval: 1s
      timeout: 1m
      retries: 5
      start_period: 15s
  db:
    ports:
      - "5432:5432"
    image: postgres:17
    environment:
      # create a database called `db`
      POSTGRES_DB: "udb"
      # trust incoming connections blindly (DON'T DO THIS IN PRODUCTION!)
      POSTGRES_HOST_AUTH_METHOD: "trust"
    healthcheck:
      test: ["CMD", "pg_isready", "--username=postgres", "--host=127.0.0.1", "--port=5432"]
      interval: 2s
      timeout: 1m
      retries: 5
      start_period: 10s
